<!doctype html>
<html>
<head><meta charset="utf-8"><title>Login</title></head>
<body>
  <h2>Login / Register</h2>
  <div>
    <input id="username" placeholder="username">
    <input id="password" placeholder="password" type="password">
    <button onclick="doRegister()">Register</button>
    <button onclick="doLogin()">Login</button>
  </div>
  <script>
    async function doRegister(){
      const u=document.getElementById('username').value; const p=document.getElementById('password').value;
      const r=await fetch('/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u,password:p})});
      alert((await r.json()).msg || JSON.stringify(await r.json()));
    }
    async function doLogin(){
      const u=document.getElementById('username').value; const p=document.getElementById('password').value;
      const r=await fetch('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u,password:p})});
      const j=await r.json();
      if (j.access_token){
        localStorage.setItem('token', j.access_token);
        location.href='/static/chat.html';
      } else { alert(JSON.stringify(j)); }
    }
  </script>
</body>
</html>
